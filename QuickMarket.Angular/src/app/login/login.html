<!-- Fondo y capa oscura -->
<div class="bg"></div>
<div class="veil"></div>

<!-- Centro: tarjeta con tabs -->
<div class="center">
  <mat-card class="auth-card" appearance="outlined">
    <mat-tab-group>
      <mat-tab label="Iniciar sesión">
        <form [formGroup]="loginForm" (ngSubmit)="submitLogin()" class="form">
          <mat-form-field appearance="outline" class="w100">
            <mat-label>Usuario</mat-label>
            <input matInput formControlName="username" autocomplete="username">
          </mat-form-field>

          <mat-form-field appearance="outline" class="w100">
            <mat-label>Contraseña</mat-label>
            <input matInput type="password" formControlName="password" autocomplete="current-password">
          </mat-form-field>

          <button mat-raised-button color="primary" class="w100" [disabled]="loading()">Entrar</button>
        </form>
      </mat-tab>

      <mat-tab label="Registrarse">
        <form [formGroup]="registerForm" (ngSubmit)="submitRegister()" class="form">
          <mat-form-field appearance="outline" class="w100">
            <mat-label>Usuario</mat-label>
            <input matInput formControlName="username" autocomplete="off">
          </mat-form-field>

          <mat-form-field appearance="outline" class="w100">
            <mat-label>Contraseña</mat-label>
            <input matInput type="password" formControlName="password" autocomplete="new-password">
          </mat-form-field>

          <mat-form-field appearance="outline" class="w100">
            <mat-label>Gmail</mat-label>
            <input matInput type="email" formControlName="gmail" autocomplete="email" placeholder="tucorreo@gmail.com">
          </mat-form-field>

          <mat-form-field appearance="outline" class="w100">
            <mat-label>ID Empleado</mat-label>
            <input matInput type="number" formControlName="idEmpleado" min="1">
          </mat-form-field>

          <button mat-raised-button color="accent" class="w100" [disabled]="loading()">Crear cuenta</button>
        </form>
      </mat-tab>
    </mat-tab-group>

    @if (loading()) { <div class="loading">Procesando…</div> }
    @if (errorMsg()) { <div class="error">{{ errorMsg() }}</div> }
  </mat-card>
</div>
